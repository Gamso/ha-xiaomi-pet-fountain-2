[project]
name = "ha-xiaomi-pet-fountain-2"
version = "0.1.0"
description = "Home Assistant custom integration for the Xiaomi Smart Pet Fountain 2 (local MIoT)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  # python-miio 0.5.12 (same pin as Home Assistant core) on Python 3.14
  "ignore::DeprecationWarning:miio.*",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PIE", "RET", "TRY"]
ignore = [
  "PLR0911",  # flow steps return one result per outcome
  "PLR0912",
  "PLR0913",  # Home Assistant entity constructors take many arguments
  "PLR2004",  # magic values in tests and MIoT codes
  "TRY003",   # messages in exceptions
  "TRY300",
  "PLC0415",  # local imports in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
